
<!DOCTYPE html>
<html>
<head>
    <title>String and Math Functions</title>
</head>
<body>

<h2>javascript String and Math Functions</h2>

<script>
let str = "Web Programming";

document.write("String: " + str + "<br>");
document.write("1. Length: " + str.length + "<br>");
document.write("2. Uppercase: " + str.toUpperCase() + "<br>");
document.write("3. Lowercase: " + str.toLowerCase() + "<br>");
document.write("4. Character: " + str.charAt(2) + "<br>");
document.write("5. Substring: " + str.substring(0,3) + "<br>");

document.write("<h3>Math Functions</h3>");
document.write("1. Square Root: " + Math.sqrt(25) + "<br>");
document.write("2. Power: " + Math.pow(2,3) + "<br>");
document.write("3. Absolute: " + Math.abs(-10) + "<br>");
document.write("4. Round: " + Math.round(5.6) + "<br>");
document.write("5. Maximum: " + Math.max(10,20) + "<br>");
document.write("6. Minimum: " + Math.min(10,20));
</script>

</body>
</html>
