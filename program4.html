<!DOCTYPE html> 
<html> 
<head> 
  <title>CSS Types</title> 
 
  <link rel="stylesheet" type="text/css" href="style.css"> 
  
  <style> 
    h2 { color: blue; text-decoration: underline; } 
    p.internal { background-color: yellow; font-size: 18px; } 
  </style> 
</head> 
<body> 
  <h1>CSS Demonstration</h1> 
 
  <h2>Internal CSS</h2> 
  <p class="internal">This paragraph is styled by the internal style sheet.</p> 
 
  <h2>External CSS</h2> 
  <p class="ext">This paragraph is styled by the external style sheet.</p> 
 
  <h2 style="color:red;">Inline CSS</h2> 
  <p style="color:white; background-color:black; padding:10px;"> 
    This paragraph is styled using the style attribute. 
  </p> 
</body> 
</html>
