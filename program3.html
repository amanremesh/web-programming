<!DOCTYPE html>
<html>
<head>
  <title>HTML Target Frames</title>
  <style>
    html, body { height: 100%; margin: 0; }
    .nav {
      float: left;
      width: 15%;
      height: 100%;
      background: #4a7c47;
    }
    .nav a {
      display: block;
      margin: 12px 2px;
      font-size: 13px;
      font-weight: bold;
    }
    iframe {
      float: left;
      width: 85%;
      height: 100%;
      border: none;
      border-left: 3px solid #888;
      box-sizing: border-box;
      background: #b5dbb0;
    }
  </style>
</head>
<body>

  <div class="nav">
    <a href="https://www.tkmce.ac.in" target="content">TKMCE,Kollam</a>
    <a href="https://www.mzce.ac.in/" target="content">MZCE,Kadammanitta</a>

  </div>

  <iframe name="content" srcdoc="
    <body style='background:#b5dbb0;font-family:Arial;font-size:13px;font-weight:bold'>
      <h3>Welcome to Main Page</h3><p>Click any link to view content.</p>">
</body>"></iframe>

</body>
</html>
