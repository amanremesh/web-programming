<!DOCTYPE html>
<html>

<head>
    <title>Yearly Calendar</title>
    <style>
        body {
            background: #e6f2ff;
            text-align: center;
            font-family: Arial;
        }

        table {
            display: inline-table;
            margin: 10px;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            border: 1px solid black;
            padding: 8px;
        }

        th {
            background: #3399ff;
            color: white;
        }

        caption {
            background: #003366;
            color: white;
            padding: 8px;
            font-weight: bold;
        }

        td:hover {
            background: yellow;
        }
    </style>
</head>

<body>

    <h2>Yearly Calendar</h2>

    <script>
        var y = parseInt(prompt("Enter Year:"));
        var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
            "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        var days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

        if (isNaN(y) || y < 1) {
            document.write("Invalid Year");
        } else {
            document.write("<h2>Calendar - " + y + "</h2>");

            for (var m = 0; m < 12; m++) {
                var first = new Date(y, m, 1).getDay();
                var total = new Date(y, m + 1, 0).getDate();

                document.write("<table><caption>" + months[m] + "</caption><tr>");

                for (var d of days)
                    document.write("<th>" + d + "</th>");

                document.write("</tr><tr>");

                for (var i = 0; i < first; i++)
                    document.write("<td></td>");

                for (var date = 1; date <= total; date++) {
                    document.write("<td>" + date + "</td>");
                    if ((first + date) % 7 == 0)
                        document.write("</tr><tr>");
                }

                document.write("</tr></table>");
            }
        }
    </script>

</body>

</html>
