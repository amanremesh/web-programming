
<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>

<body bgcolor="lightblue">
<center>

    <h2 style="color:darkblue;">Student Registration Form</h2>

    <form onsubmit="register(event)">
        <table cellpadding="8">

            <tr><td>Name:</td><td><input type="text" required></td></tr>
            <tr><td>Email:</td><td><input type="email" required></td></tr>
            <tr><td>Password:</td><td><input type="password" required></td></tr>

            <tr><td>Gender:</td><td>
                <input type="radio" name="gender" required> Male
                <input type="radio" name="gender"> Female
                <input type="radio" name="gender"> Other
            </td></tr>

            <tr><td>DOB:</td><td><input type="date"></td></tr>

            <tr><td>Hobbies:</td><td>
                <input type="checkbox"> Reading
                <input type="checkbox"> Music
                <input type="checkbox"> Sports
            </td></tr>

            <tr><td>Course:</td><td>
                <select required>
                    <option value="">Select</option>
                    <option>MCA</option>
                    <option>MBA</option>
                    <option>BCA</option>
                </select>
            </td></tr>

            <tr><td>Address:</td><td>
                <textarea rows="3" cols="20"></textarea>
            </td></tr>

            <tr><td></td><td>
                <input type="submit" value="Register" style="background:lightgreen;">
                <input type="reset" value="Clear" style="background:lightcoral;">
            </td></tr>

        </table>
    </form>

    <h3 id="msg" style="color:green;"></h3>

</center>

<script>
function register(e) {
    e.preventDefault();
    document.getElementById("msg").innerHTML =
        "Registration Successful!";
}
</script>

</body>
</html>
